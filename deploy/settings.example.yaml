llm-pi-ai:
  providers:
    token-plan:
      displayName: Aliyun Token Plan
      apiKeyEnv: TOKEN_PLAN_DASHSCOPE_API_KEY
      api: openai-completions
      baseURL: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      reasoning: high
      compat:
        supportsDeveloperRole: false
        maxTokensField: max_tokens
      models:
        - id: deepseek-v4.1-flash
          displayName: DeepSeek V4.1 Flash
          compat:
            thinkingFormat: deepseek
          reasoningEfforts:
            off:
            low: low
            high: high
            max: max
        - id: deepseek-v4-pro
          displayName: DeepSeek V4 Pro
          compat:
            thinkingFormat: deepseek
          reasoningEfforts:
            off:
            low: low
            high: high
            max: max
        - id: qwen3.8-max
          displayName: Qwen3.8 Max
          input: [ text, image ]
          compat:
            thinkingFormat: deepseek
          reasoningEfforts:
            off:
            high: high
            max: max
        - id: qwen3.8-flash
          displayName: Qwen3.8 Flash
          input: [ text, image ]
          compat:
            thinkingFormat: deepseek
          reasoningEfforts:
            off:
            high: high
            max: max
        - id: kimi-k2.7-code
          displayName: Kimi K2.7 Code
          input: [ text, image ]
          reasoningEfforts:
            high: high
            max: max
        - id: glm-5.2
          displayName: GLM 5.2
          reasoningEfforts:
            high: high
            max: max
ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
agent-default-model:
  provider: token-plan
  model: deepseek-v4.1-flash
  reasoningEffort: high
