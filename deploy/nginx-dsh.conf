map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

# Zero-interaction public entry for DeepSeek Harness (sandbox deployment,
# owner's explicit call: no token handling, no password prompt).
# Flow: first visit -> no dsh cookie -> 302 /entry -> sidecar clears stale
# dsh-auth cookies and reads the boot token from the journal -> 302
# /?token=... -> dsh sets its session cookie (browser UA) -> UI live.
server {
    # Image attachments travel as base64 inside the prompt JSON (~4/3 of the
    # file size); nginx's default 1m rejects a 2-3 MB upload with 413.
    client_max_body_size 64m;
    listen 8099;
    server_name _;

    location = /entry {
        proxy_pass http://127.0.0.1:3082;
        proxy_set_header Host $http_host;
    }

    # Generated images referenced by inline markdown; same-origin so the
    # authenticated browser sends its cookie anyway.
    location /dsh-images/ {
        proxy_pass http://127.0.0.1:3081;
        proxy_set_header Host $http_host;
    }

    location / {
        set $need_entry 1;
        if ($http_cookie ~* "dsh-auth-") {
            set $need_entry 0;
        }
        if ($arg_token != "") {
            set $need_entry 0;
        }
        if ($need_entry = 1) {
            return 302 /entry;
        }
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        # Stale cookies from earlier boots slip past the cookie check and get
        # refused by dsh; bounce those 401s into the silent ticket exchange so
        # the tab re-issues its cookie instead of reconnect-looping forever.
        proxy_intercept_errors on;
        error_page 401 =302 /entry;
    }

    location /katex/ {
        alias /opt/dsh-katex/;
        add_header Cache-Control "public, max-age=86400";
    }
}
